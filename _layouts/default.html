<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page.title }}{% if page.title != site.title %} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">Folio</a>
  <nav>
    <a href="{{ '/support/' | relative_url }}">Support</a>
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
  </nav>
</header>
<main>
  {% if page.title != site.title %}<h1>{{ page.title }}</h1>{% endif %}
  {{ content }}
</main>
<footer class="site">
  <p>© 2026 BlueTao LLC. Folio is made for iPhone, iPad, and Mac.</p>
</footer>
</body>
</html>
